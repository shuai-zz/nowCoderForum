# spring config
spring:
  application:
    name: nowCoder Forum
  config:
    import: optional:file:.env[.properties]
  # JDK21 虚拟线程：IO 密集型场景吞吐显著提升
  threads:
    virtual:
      enabled: true
  # QuartzProperties
  quartz:
    job-store-type: memory
    scheduler-name: communityScheduler
  # TaskExecutionProperties（虚拟线程启用后，@Async 默认走虚拟线程池）
  task:
    execution:
      pool:
        core-size: 5
        max-size: 15
        queue-capacity: 100
    scheduling:
      pool:
        size: 5
  # ElasticSearch
  elasticsearch:
    uris: http://localhost:9200
  # kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: default-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      auto-commit-interval-ms: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
  # DataSource: MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/forum?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 30000
  # Flyway: schema 版本化迁移
  # 前置：数据库 forum 必须已存在（一次性手动 CREATE DATABASE，由 DBA / 部署脚本负责）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true     # 已有数据库（首次接 Flyway）时设为基线，新项目不会触发
    validate-on-migrate: true
    table: flyway_schema_history
  # Mail
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          ssl.enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

server:
  port: 8080

# MyBatis Plus（替换原 mybatis 配置）
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.user.domain.entity,com.example.post.domain.entity,com.example.interaction.domain.entity,com.example.message.domain.entity
  configuration:
    use-generated-keys: true
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# log
logging:
  level:
    org:
      example:
        nowcoder:
          web: debug

nowcoder:
  path:
    domain: http://localhost:8080
    frontend: http://localhost:5173
    upload: ${UPLOAD_PATH}
  cors:
    allowed-origins: http://localhost:5173

nowcoder-captcha:
  # kaptcha（默认，本地图形验证码）/ tencent（腾讯云行为验证码）
  provider: ${CAPTCHA_PROVIDER:kaptcha}
  tencent:
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    captcha-app-id: ${TENCENT_CAPTCHA_APP_ID:0}
    app-secret-key: ${TENCENT_CAPTCHA_APP_SECRET_KEY:}
